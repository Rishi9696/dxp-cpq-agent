name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit (high/critical only)
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` doesn't fail on missing env at build time.
          # Real values are injected at runtime/deploy (Vercel project settings).
          ANTHROPIC_API_KEY: ci-placeholder
          DXP_AGENT_ID: ci-placeholder
          DXP_ENVIRONMENT_ID: ci-placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_ANON_KEY: ci-placeholder
